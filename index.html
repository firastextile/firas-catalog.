<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الكتالوج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>

:root{--bg:#fbf6ea;--bg2:#f1e7cf;--card:#fff;--text:#0c2f31;--muted:#6b7a76;--line:#e6dcc3;--teal:#0c4448;--teal2:#062a2c;--gold:#c9a341;--gold2:#f3df9a;--goldd:#8a6d1c;--ok:#0f9d6c;--bad:#be123c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--text);min-height:100vh;padding-bottom:40px}
body.hascart{padding-bottom:96px}
body.lock{overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:18px 16px 6px;max-width:900px;margin:0 auto}
.top img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:var(--teal2);box-shadow:0 4px 14px rgba(12,68,72,.3)}
.top h1{font-size:24px;font-weight:800;color:var(--teal);line-height:1.2}
.wrap{max-width:900px;margin:0 auto;padding:6px 14px 14px}
.title{text-align:center;margin:8px 0 14px}
.title h2{font-size:44px;font-weight:900;color:var(--teal);line-height:1.2}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
.divider i{display:block;height:2px;width:90px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider i:last-child{background:linear-gradient(-90deg,transparent,var(--gold))}
.divider b{display:block;width:10px;height:10px;background:var(--gold);transform:rotate(45deg)}
.search{width:100%;height:46px;border-radius:23px;border:2px solid var(--line);background:#fff;color:var(--text);padding:0 18px;font:inherit;font-size:15px;margin-bottom:10px;outline:0}
.search:focus{border-color:var(--teal)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;color:var(--teal);border-radius:999px;padding:7px 18px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:var(--gold2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:#fff;border:2px solid var(--teal);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 6px 16px rgba(12,68,72,.16)}
.card:active{transform:scale(.98)}
.ph{position:relative;aspect-ratio:3/4;background:var(--teal2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .shade{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(transparent,rgba(3,22,24,.55))}
.out .ph img{filter:grayscale(1);opacity:.5}
.noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9fb3ae;font-size:13px}
.tag{position:absolute;top:10px;right:10px;font-size:12px;font-weight:800;padding:3px 12px;border-radius:999px;color:#fff;z-index:2}
.tag.new{background:#e0314b}
.tag.out{background:var(--bad)}
.count{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 9px;border-radius:999px;z-index:2}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.name{font-size:15px;font-weight:800;line-height:1.4;color:var(--teal);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{display:inline-block;white-space:nowrap;background:var(--teal);color:var(--gold2);font-size:13px;font-weight:900;padding:3px 10px;border-radius:999px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--gold)}
.plus{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--gold);color:var(--teal2);font-size:22px;font-weight:900;line-height:1;cursor:pointer;font-family:inherit}
.btn{display:block;text-align:center;text-decoration:none;background:#16a34a;color:#fff;font-weight:800;font-size:15px;padding:12px;border-radius:14px;border:0;font-family:inherit;cursor:pointer;width:100%}
.btn.add{background:var(--teal);color:var(--gold2)}
.btn.dis{background:var(--line);color:var(--muted);pointer-events:none}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
select{width:100%;height:42px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--text);font:inherit;font-size:14px;padding:0 10px}
#cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(251,246,234,.96);border-top:2px solid var(--gold);display:none}
#cartbar.on{display:block}
#cartbar .btn{margin:0 auto;max-width:640px;background:var(--teal);color:var(--gold2);display:flex;align-items:center;justify-content:space-between;gap:10px}
#drawer,#detail{position:fixed;left:0;right:0;top:0;bottom:0;display:none}
#drawer{z-index:30;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
#drawer.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;border-top:3px solid var(--gold)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px;color:var(--teal)}
.sh-x{border:0;background:var(--line);color:var(--teal);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.lines{overflow-y:auto;padding:4px 16px}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line img,.line .lph{width:64px;height:80px;border-radius:12px;object-fit:cover;background:var(--line);flex:none;border:2px solid var(--teal)}
.li{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.li b{font-size:14px;color:var(--teal)}
.li small{color:var(--muted);font-size:12px}
.li .lp{color:var(--goldd);font-weight:900;font-size:15px}
.qrow{display:flex;align-items:center;gap:10px;margin-top:auto}
.qb{width:32px;height:32px;border-radius:50%;border:2px solid var(--teal);background:#fff;color:var(--teal);font-size:17px;font-weight:900;cursor:pointer}
.qn{min-width:22px;text-align:center;font-weight:800}
.rm{margin-right:auto;border:0;background:transparent;color:var(--bad);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.sh-f{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:17px;margin-bottom:10px;color:var(--teal)}
.hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;text-align:center}
#detail{z-index:25;background:linear-gradient(var(--bg),var(--bg2));overflow-y:auto;-webkit-overflow-scrolling:touch}
#detail.on{display:block}
.dwrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
.dbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 0;background:linear-gradient(var(--bg),rgba(251,246,234,.92))}
.back{border:0;background:var(--teal);color:var(--gold2);height:38px;padding:0 16px;border-radius:19px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.dstore{font-weight:800;color:var(--teal);font-size:15px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:3/4;background:var(--teal2);border-radius:24px;border:3px solid var(--teal);scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.gwrap{position:relative}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs img{flex:none;width:56px;height:70px;border-radius:12px;object-fit:cover;border:2px solid var(--line);cursor:pointer;opacity:.75}
.thumbs img.on{border-color:var(--gold);opacity:1}
.dinfo{padding:14px 2px 6px;display:flex;flex-direction:column;gap:10px}
.dname{font-size:28px;font-weight:900;color:var(--teal);line-height:1.3}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:800;padding:4px 14px;border-radius:999px}
.pill.cat{background:var(--teal);color:var(--gold2)}
.pill.ok{background:var(--ok);color:#fff}
.pill.bad{background:var(--bad);color:#fff}
.dprice{font-size:24px;padding:4px 22px}
.more{margin-top:22px}
.more h3{font-size:20px;font-weight:900;color:var(--teal);margin-bottom:10px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(6,42,44,.95);color:var(--gold2);padding:9px 18px;border-radius:999px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}

</style>
</head>
<body>
<div class="top"><img id="logo" alt="" style="display:none"><h1 id="sname"></h1></div>
<div class="wrap">
<div class="title"><h2 id="ctitle"></h2><div class="divider"><i></i><b></b><i></i></div></div>
<input id="q" class="search" type="search" placeholder="ابحث عن صنف...">
<div id="chips" class="chips"></div>
<div id="grid" class="grid"></div>
</div>
<div id="detail"></div>
<div id="cartbar"><button id="cbtn" class="btn"></button></div>
<div id="drawer"><div class="sheet"><div class="sh-h"><span>سلة الطلب</span><button id="dclose" class="sh-x">✕</button></div><div id="lines" class="lines"></div><div class="sh-f"><div class="tot"><span>الإجمالي</span><span id="ctot"></span></div><button id="send" class="btn">إرسال الطلب عبر واتساب</button><button id="clear" class="btn ghost">تفريغ السلة</button><div class="hint">يصلك رابط صورة كل صنف داخل رسالة الطلب، وهي نفس الصورة التي اخترتها.</div></div></div></div>
<div id="toast"></div>
<script>
fetch("catalog.json?v="+Date.now()).then(function(r){if(!r.ok)throw new Error("load");return r.json()}).then(function(D){
document.title=D.store.name||document.title;

var cat="الكل",q="",cart=[],cur=null,dIdx=0;
var $=function(id){return document.getElementById(id)};
var KEY="almakhzan_cart_"+location.pathname;
var DAY=86400000;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function find(id){return D.items.filter(function(x){return x.id===id})[0]}
function absUrl(u){if(!u||u.indexOf("data:")===0)return "";try{return new URL(u,location.href.split("#")[0].split("?")[0]).href}catch(e){return ""}}
function saveCart(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}}
function loadCart(){try{var c=JSON.parse(localStorage.getItem(KEY)||"[]");cart=c.filter(function(l){return find(l.id)})}catch(e){cart=[]}}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.className="on";clearTimeout(tt);tt=setTimeout(function(){t.className=""},1800)}
function cats(){var s=["الكل"];D.items.forEach(function(i){if(s.indexOf(i.cat)<0)s.push(i.cat)});return s}
function renderChips(){$("chips").innerHTML=cats().map(function(c){return "<button class=\"chip"+(c===cat?" on":"")+"\" data-c=\""+esc(c)+"\">"+esc(c)+"</button>"}).join("")}
function isNew(i){return i.ts&&(Date.now()-i.ts)<2*DAY&&i.inStock}
function pr(i){return "<span class=\"price\">"+i.price+" "+esc(D.store.currency)+"</span>"}
function card(i){
 var im=i.images.length?"<img loading=\"lazy\" src=\""+i.images[0]+"\" alt=\""+esc(i.name)+"\">":"<div class=\"noimg\">بدون صورة</div>";
 var tag=!i.inStock?"<span class=\"tag out\">نفد</span>":(isNew(i)?"<span class=\"tag new\">جديد</span>":"");
 var plus=(i.inStock&&!i.colors.length&&!i.sizes.length)?"<button class=\"plus\" data-add=\""+esc(i.id)+"\" aria-label=\"أضف للسلة\">+</button>":"";
 return "<div class=\"card"+(i.inStock?"":" out")+"\" data-open=\""+esc(i.id)+"\"><div class=\"ph\">"+im+"<div class=\"shade\"></div>"+tag+(i.images.length>1?"<span class=\"count\">📷 "+i.images.length+"</span>":"")+"</div><div class=\"body\"><div class=\"name\">"+esc(i.name)+"</div><div class=\"row\">"+pr(i)+plus+"</div></div></div>"}
function render(){var l=D.items.filter(function(i){return (cat==="الكل"||i.cat===cat)&&(!q||i.name.toLowerCase().indexOf(q)>=0)});
 l.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
 $("ctitle").textContent=cat==="الكل"?"جميع الأصناف":cat;
 $("grid").innerHTML=l.length?l.map(card).join(""):"<div class=\"empty\" style=\"grid-column:1/-1\">لا توجد أصناف مطابقة</div>"}
function totals(){var n=0,t=0;cart.forEach(function(l){var it=find(l.id);if(it){n+=l.qty;t+=l.qty*it.price}});return {n:n,t:t}}
function renderCart(){
 var s=totals();document.body.className=(cart.length?"hascart":"")+(cur?" lock":"");
 $("cartbar").className=cart.length?"on":"";
 $("cbtn").innerHTML="<span>🛒 السلة ("+s.n+")</span><span>"+s.t+" "+esc(D.store.currency)+"</span>";
 $("lines").innerHTML=cart.length?cart.map(function(l,k){var it=find(l.id);var u=it.images[l.idx]||it.images[0];
  var det=[];if(l.color)det.push("اللون: "+esc(l.color));if(l.size)det.push("المقاس: "+esc(l.size));
  return "<div class=\"line\">"+(u?"<img src=\""+u+"\" alt=\"\">":"<div class=\"lph\"></div>")+"<div class=\"li\"><b>"+esc(it.name)+"</b>"+(det.length?"<small>"+det.join(" - ")+"</small>":"")+"<span class=\"lp\">"+(it.price*l.qty)+" "+esc(D.store.currency)+"</span><div class=\"qrow\"><button class=\"qb\" data-q=\"-1\" data-k=\""+k+"\">-</button><span class=\"qn\">"+l.qty+"</span><button class=\"qb\" data-q=\"1\" data-k=\""+k+"\">+</button><button class=\"rm\" data-rm=\""+k+"\">حذف</button></div></div></div>"}).join(""):"<div class=\"empty\">السلة فارغة</div>";
 $("ctot").textContent=s.t+" "+D.store.currency;
 if(!cart.length)$("drawer").className=""}
function pushCart(id,color,size,idx){
 var ex=cart.filter(function(l){return l.id===id&&l.color===color&&l.size===size&&l.idx===idx})[0];
 if(ex)ex.qty+=1;else cart.push({id:id,color:color,size:size,idx:idx,qty:1});
 saveCart();renderCart();toast("تمت الإضافة للسلة ✓")}
function addFromDetail(){
 var it=cur;if(!it)return;
 var c=$("dc"),s=$("ds");
 if(it.colors.length&&!(c&&c.value)){toast("اختر اللون أولاً");return}
 if(it.sizes.length&&!(s&&s.value)){toast("اختر المقاس أولاً");return}
 pushCart(it.id,c?c.value:"",s?s.value:"",dIdx)}
function buildOrderUrl(){
 var cu=D.store.currency,total=0,out=["السلام عليكم، أريد طلب الأصناف التالية:",""];
 cart.forEach(function(l,n){var it=find(l.id);if(!it)return;var sub=it.price*l.qty;total+=sub;
  var det=[];if(l.color)det.push("اللون: "+l.color);if(l.size)det.push("المقاس: "+l.size);
  out.push((n+1)+") "+it.name);
  if(det.length)out.push("   "+det.join(" - "));
  out.push("   الكمية: "+l.qty+" × "+it.price+" "+cu+" = "+sub+" "+cu);
  var u=absUrl(it.images[l.idx]||it.images[0]);if(u)out.push("   الصورة: "+u);
  out.push("")});
 out.push("الإجمالي: "+total+" "+cu);
 return "https://wa.me/"+D.store.phone+"?text="+encodeURIComponent(out.join("\n"))}
function openItem(id,push){
 var it=find(id);if(!it)return;cur=it;dIdx=0;
 var g=it.images.length?it.images.map(function(u){return "<img src=\""+u+"\" alt=\""+esc(it.name)+"\">"}).join(""):"<div class=\"noimg\">بدون صورة</div>";
 var th=it.images.length>1?"<div class=\"thumbs\" id=\"thumbs\">"+it.images.map(function(u,k){return "<img data-t=\""+k+"\" class=\""+(k?"":"on")+"\" src=\""+u+"\" alt=\"\">"}).join("")+"</div>":"";
 var h="<div class=\"dwrap\"><div class=\"dbar\"><button class=\"back\" id=\"back\">→ رجوع</button><span class=\"dstore\">"+esc(D.store.name||"")+"</span></div>"+
  "<div class=\"gwrap\"><div class=\"gal\" id=\"dgal\">"+g+"</div>"+(it.images.length>1?"<span class=\"count\" id=\"dcount\">1/"+it.images.length+"</span>":"")+"</div>"+th+
  "<div class=\"dinfo\"><div class=\"dname\">"+esc(it.name)+"</div><div class=\"chiprow\"><span class=\"pill cat\">"+esc(it.cat)+"</span><span class=\"pill "+(it.inStock?"ok":"bad")+"\">"+(it.inStock?"✓ متوفر":"نفد")+"</span>"+(isNew(it)?"<span class=\"pill\" style=\"background:#e0314b;color:#fff\">جديد</span>":"")+"</div>"+
  "<div><span class=\"price dprice\">"+it.price+" "+esc(D.store.currency)+"</span></div>";
 if(it.inStock&&it.colors.length)h+="<select id=\"dc\"><option value=\"\">اختر اللون</option>"+it.colors.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+"</select>";
 if(it.inStock&&it.sizes.length)h+="<select id=\"ds\"><option value=\"\">اختر المقاس</option>"+it.sizes.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+"</select>";
 h+=it.inStock?"<button class=\"btn add\" id=\"dadd\">أضف للسلة 🛒</button>":"<span class=\"btn dis\">نفد</span>";
 h+="</div>";
 var others=D.items.filter(function(x){return x.id!==it.id}).sort(function(a,b){var sa=a.cat===it.cat?1:0,sb=b.cat===it.cat?1:0;return sb-sa||(b.ts||0)-(a.ts||0)}).slice(0,12);
 if(others.length)h+="<div class=\"more\"><h3>أصناف أخرى</h3><div class=\"grid\">"+others.map(card).join("")+"</div></div>";
 h+="</div>";
 $("detail").innerHTML=h;$("detail").className="on";$("detail").scrollTop=0;
 document.body.className=(cart.length?"hascart":"")+" lock";
 if(push!==false){try{history.pushState(null,"","#i="+encodeURIComponent(id))}catch(e){location.hash="i="+encodeURIComponent(id)}}}
function closeItem(){cur=null;$("detail").className="";$("detail").innerHTML="";document.body.className=cart.length?"hascart":""}
function fromHash(){var m=/[#&]i=([^&]+)/.exec(location.hash||"");if(m){var id=decodeURIComponent(m[1]);if(find(id)){openItem(id,false);return}}if(cur)closeItem()}
$("chips").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c!==null){cat=c;renderChips();render()}});
$("q").addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();render()});
function onGrid(e){var t=e.target,a=t.getAttribute&&t.getAttribute("data-add");
 if(a){e.stopPropagation();var it=find(a);if(it)pushCart(a,"","",0);return}
 var c=t.closest?t.closest("[data-open]"):null;if(c)openItem(c.getAttribute("data-open"))}
$("grid").addEventListener("click",onGrid);
$("detail").addEventListener("click",function(e){var t=e.target;
 if(t.id==="back"){if(history.state===null&&/i=/.test(location.hash))history.back();else closeItem();return}
 if(t.id==="dadd"){addFromDetail();return}
 var k=t.getAttribute("data-t");if(k!==null){var g=$("dgal");g.scrollTo({left:-(+k)*g.clientWidth*(document.dir==="rtl"||getComputedStyle(g).direction==="rtl"?1:-1),behavior:"smooth"});return}
 onGrid(e)});
$("detail").addEventListener("scroll",function(e){var el=e.target;if(!el||el.id!=="dgal")return;var n=el.children.length,w=el.clientWidth||1,k=Math.min(n-1,Math.max(0,Math.round(Math.abs(el.scrollLeft)/w)));dIdx=k;var c=$("dcount");if(c)c.textContent=(k+1)+"/"+n;var ts=$("thumbs");if(ts)Array.prototype.forEach.call(ts.children,function(x,j){x.className=j===k?"on":""})},true);
window.addEventListener("popstate",fromHash);window.addEventListener("hashchange",fromHash);
$("cbtn").addEventListener("click",function(){$("drawer").className="on"});
$("dclose").addEventListener("click",function(){$("drawer").className=""});
$("drawer").addEventListener("click",function(e){if(e.target===$("drawer"))$("drawer").className=""});
$("lines").addEventListener("click",function(e){var t=e.target,k;
 if(t.getAttribute("data-q")!==null){k=+t.getAttribute("data-k");cart[k].qty+=+t.getAttribute("data-q");if(cart[k].qty<1)cart.splice(k,1)}
 else if(t.getAttribute("data-rm")!==null){cart.splice(+t.getAttribute("data-rm"),1)}
 else return;
 saveCart();renderCart()});
