<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الكتالوج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#1d4ed8;--price:#b45309;--ok:#059669;--bad:#be123c}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d13;--card:#141824;--text:#f1f5f9;--muted:#94a3b8;--line:#232a3b;--accent:#3b82f6;--price:#fbbf24}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
header{display:flex;align-items:center;gap:12px;padding:16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header img{width:48px;height:48px;border-radius:12px;object-fit:cover}
header h1{font-size:20px;font-weight:800}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font:inherit;font-size:15px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:3/4;background:var(--line)}
.gal img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.noimg{flex:none;width:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.out .gal img{filter:grayscale(1);opacity:.55}
.badge{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;z-index:2}
.gwrap{position:relative}
.count{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;z-index:2;pointer-events:none}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:11px;color:var(--muted)}
.name{font-size:15px;font-weight:800;line-height:1.4}
.price{font-size:18px;font-weight:800;color:var(--price)}
select{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px;padding:0 8px}
.btn{margin-top:auto;display:block;text-align:center;text-decoration:none;background:#16a34a;color:#fff;font-weight:800;font-size:14px;padding:11px;border-radius:12px;border:0;font-family:inherit;cursor:pointer;width:100%}
.btn.dis{background:var(--line);color:var(--muted);pointer-events:none}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<header><img id="logo" alt="" style="display:none"><h1 id="sname"></h1></header>
<div class="wrap">
<input id="q" class="search" type="search" placeholder="ابحث عن صنف...">
<div id="chips" class="chips"></div>
<div id="grid" class="grid"></div>
</div>
<script>
fetch("catalog.json?v="+Date.now()).then(function(r){if(!r.ok)throw new Error("load");return r.json()}).then(function(D){
document.title=D.store.name||document.title;
var cat="الكل",q="";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function cats(){var s=["الكل"];D.items.forEach(function(i){if(s.indexOf(i.cat)<0)s.push(i.cat)});return s}
function renderChips(){$("chips").innerHTML=cats().map(function(c){return "<button class=\"chip"+(c===cat?" on":"")+"\" data-c=\""+esc(c)+"\">"+esc(c)+"</button>"}).join("")}
function link(i){var c=$("c"+i.id),s=$("s"+i.id);var m="السلام عليكم، أريد الصنف: "+i.name;if(c&&c.value)m+=" - اللون: "+c.value;if(s&&s.value)m+=" - المقاس: "+s.value;return "https://wa.me/"+D.store.phone+"?text="+encodeURIComponent(m)}
function card(i){
 var g=i.images.length?i.images.map(function(u){return "<img loading=\"lazy\" src=\""+u+"\" alt=\""+esc(i.name)+"\">"}).join(""):"<div class=\"noimg\">بدون صورة</div>";
 var h="<div class=\"card"+(i.inStock?"":" out")+"\"><div class=\"gwrap\">"+(i.inStock?"":"<span class=\"badge\">نفد</span>")+(i.images.length>1?"<span class=\"count\">1/"+i.images.length+"</span>":"")+"<div class=\"gal\">"+g+"</div></div><div class=\"body\"><div class=\"cat\">"+esc(i.cat)+"</div><div class=\"name\">"+esc(i.name)+"</div><div class=\"price\">"+i.price+" "+esc(D.store.currency)+"</div>";
 if(i.inStock&&i.colors.length)h+="<select id=\"c"+i.id+"\"><option value=\"\">اختر اللون</option>"+i.colors.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+"</select>";
 if(i.inStock&&i.sizes.length)h+="<select id=\"s"+i.id+"\"><option value=\"\">اختر المقاس</option>"+i.sizes.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+"</select>";
 h+=i.inStock?"<button class=\"btn\" data-o=\""+i.id+"\">اطلب عبر واتساب</button>":"<span class=\"btn dis\">نفد</span>";
 return h+"</div></div>"}
function render(){var l=D.items.filter(function(i){return (cat==="الكل"||i.cat===cat)&&(!q||i.name.toLowerCase().indexOf(q)>=0)});
 $("grid").innerHTML=l.length?l.map(card).join(""):"<div class=\"empty\" style=\"grid-column:1/-1\">لا توجد أصناف مطابقة</div>"}
$("chips").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c!==null){cat=c;renderChips();render()}});
$("q").addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();render()});
$("grid").addEventListener("click",function(e){var id=e.target.getAttribute("data-o");if(!id)return;var it=D.items.filter(function(x){return x.id===id})[0];if(it)window.location.href=link(it)});
$("grid").addEventListener("scroll",function(e){var el=e.target;if(!el||!el.classList||!el.classList.contains("gal"))return;var n=el.children.length,w=el.clientWidth||1,k=Math.min(n,Math.max(1,Math.round(Math.abs(el.scrollLeft)/w)+1));var c=el.parentNode.querySelector(".count");if(c)c.textContent=k+"/"+n},true);
$("sname").textContent=D.store.name;if(D.store.logo){$("logo").src=D.store.logo;$("logo").style.display="block"}
renderChips();render();
}).catch(function(){document.getElementById("grid").innerHTML="<div class=\"empty\" style=\"grid-column:1/-1\">تعذر تحميل الكتالوج، حاول لاحقاً</div>"});
</script>
</body>
</html>
